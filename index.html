<script type="module">

// ---------------------------------------------------------------- settings

const canvas = document.getElementById('game');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.5, 260);
const FOG_COLOR = 0x2aa7c0;
scene.fog = new THREE.Fog(FOG_COLOR, 30, 70);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.7); sun.position.set(6, 20, 12); scene.add(sun);
const fill = new THREE.DirectionalLight(0xff9ad0, 0.5); fill.position.set(-10, 2, 8); scene.add(fill);

const U = { time: { value: 0 }, sway: { value: 1 } };

// ---------------------------------------------------------------- shared geometry & materials
const SPH = new THREE.SphereGeometry(1, 24, 16);
const SPH_LO = new THREE.SphereGeometry(1, 12, 8);
const HEMI = new THREE.SphereGeometry(1, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2);
const CONE = new THREE.ConeGeometry(1, 1, 16);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 14);
const SMILE_GEO = new THREE.TorusGeometry(1, 0.2, 6, 18, Math.PI);

const matCache = new Map();
function lam(color, emissive = 0x000000, extra = {}) {
  const key = color + ':' + emissive + ':' + JSON.stringify(extra);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial({ color, emissive, ...extra }));

}

const WHITE = basic(0xffffff);

function swayMat(params, o) {

    vec3 transformed = vec3(position);
    float hh = clamp(${f3(o.dir || 1)} * position.y / ${f3(o.len)}, 0.0, 1.0);
    vec4 wo = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
    float ph = wo.x * 0.9 + wo.z * 1.7 + position.x * ${f3(o.xph || 0)} + position.z * ${f3(o.xph || 0)};

// glow sprite texture
const GLOW_TEX = canvasTexture(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');

// faces
function makeEye(r) {

  const w = mesh(SPH, WHITE, g); w.scale.setScalar(r);
  const p = mesh(SPH, INK, g); p.scale.setScalar(r * 0.58); p.position.z = r * 0.55;
  const h = mesh(SPH_LO, WHITE, g); h.scale.setScalar(r * 0.2); h.position.set(r * 0.22, r * 0.26, r * 1.02);
  g.userData.pupil = p; g.userData.r = r;
  return g;
}
function makeSmile(r) { const m = new THREE.Mesh(SMILE_GEO, INK); m.scale.setScalar(r); m.rotation.z = Math.PI; return m; }

function bothSides(parent, make, x, y, z, turn = 0) {
  const out = [];
  for (const s of [1, -1]) {
    const o = make(); o.position.set(x, y, z * s);
    o.rotation.y = s > 0 ? turn : Math.PI - turn;
    parent.add(o); out.push(o);

// ---------------------------------------------------------------- world layout
const FLOOR = -3.2;
function groundH(x, z) {
  let h = 0.22 * Math.sin(x * 0.42 + z * 0.3) + 0.16 * Math.sin(x * 0.17 - z * 0.53 + 1.3) + 0.07 * Math.sin(x * 1.1 + z * 0.9);

}

const SUB_Z = 1.0;
const BOUNDS = { minX: -13, maxX: 13, maxY: 5.4 };
const subMinY = (x) => groundY(x, SUB_Z) + 1.35;

const SLOT_X = [-10.0, -6.85, -3.7, -0.55, 2.6, 5.75];

// ---------------------------------------------------------------- seabed
{
  const geo = new THREE.PlaneGeometry(220, 150, 150, 100);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const sand = new THREE.Color(0xf7dcb2), sandWarm = new THREE.Color(0xffd6c0), lav = new THREE.Color(0xa58ae0), deep = new THREE.Color(0x6a54b8);
  const c = new THREE.Color();
  const r2 = rng(5);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundH(x, z));
    const back = clamp((-z - 3) / 14, 0, 1);
    c.copy(sand).lerp(sandWarm, 0.5 + 0.5 * Math.sin(x * 0.3 + z * 0.5));
    c.lerp(lav, back * 0.85).lerp(deep, clamp((-z - 18) / 20, 0, 1));
    const sp = (r2() - 0.5) * 0.06; c.r += sp; c.g += sp; c.b += sp;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const floor = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  floor.position.y = FLOOR; scene.add(floor);

  // caustic light pattern drifting over the sand
  const S = 128, pts = [];
  const r3 = rng(9);
  for (let i = 0; i < 18; i++) pts.push([r3() * S, r3() * S]);
  const caustic = canvasTexture(S, S, (g) => {
    const img = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let d1 = 1e9, d2 = 1e9;
      for (const [px, py] of pts) for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {

        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
      const e = Math.sqrt(d2) - Math.sqrt(d1);
      const v = Math.pow(clamp(1 - e / 7, 0, 1), 3) * 255;
      const k = (y * S + x) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = v; img.data[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  });
  caustic.wrapS = caustic.wrapT = THREE.RepeatWrapping; caustic.repeat.set(9, 5);
  const cm = new THREE.MeshBasicMaterial({ map: caustic, color: 0x9ffcff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
  const cGeo = new THREE.PlaneGeometry(70, 34, 70, 34); cGeo.rotateX(-Math.PI / 2); cGeo.translate(0, 0, 3);
  const cp = cGeo.attributes.position; const fade = new Float32Array(cp.count * 3);

const SPOT_BUILDERS = { clam: buildClam, arch: buildCoralArchSpot, plant: buildPlantSpot };

let spots = [];
let layoutSig = '';
function clearSpots() {
  for (const s of spots) {
    scene.remove(s.group);
  }
  spots = [];
}
function buildLayout() {
  clearSpots();
  let sig, slots, types, order;
  let guard = 0;
  do {
    slots = shuffle([...SLOT_X.keys()]).slice(0, 5).sort((a, b) => a - b);
    types = shuffle(['clam', 'arch', 'plant', ...shuffle(['clam', 'arch', 'plant']).slice(0, 2)]);
    order = shuffle([0, 1, 2, 3, 4]);
    sig = slots.map((s, i) => s + types[i][0] + order[i]).join('|');
  } while (sig === layoutSig && guard++ < 20);
  layoutSig = sig;
  slots.forEach((slot, i) => {
    const x = SLOT_X[slot] + (Math.random() - 0.5) * 0.3;
    const z = (slot % 2 ? -1.0 : -0.4) - Math.random() * 0.5;
    const b = SPOT_BUILDERS[types[i]]();
    const holder = new THREE.Group(); holder.add(b.group);
    holder.position.set(x, groundY(x, z) - 0.05, z);
    holder.rotation.y = (Math.random() - 0.5) * 0.4;
    scene.add(holder);
    const cr = creatures[order[i]];
    const peek = makePeekEyes(cr.def.color); peek.position.copy(b.peekPos); b.group.add(peek);
    const spot = {
      type: types[i], slot, group: holder, inner: b, peek, creature: cr, revealed: false, open: 0,
      center: new THREE.Vector3(x, holder.position.y + b.hitY, z),
      timer: Math.random() * 2, bubT: Math.random(), wig: 0, wigT: 1 + Math.random() * 3, peekPh: Math.random() * 6,
    };
    cr.spot = spot;
    spots.push(spot);
  });
}

const Sound = {
  ctx: null, master: null, enabled: settings.sound, noiseBuf: null, ambientT: 2,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = this.enabled ? 0.75 : 0;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(c.destination);
    const len = c.sampleRate * 1.5; this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // soft ocean pad
    const pad = c.createGain(); pad.gain.value = 0.018; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    pad.connect(lp); lp.connect(this.master);
    for (const f of [130.81, 196.0, 261.63]) { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 8; o.connect(pad); o.start(); }
    const lfo = c.createOscillator(); lfo.frequency.value = 0.08; const lg = c.createGain(); lg.gain.value = 0.012; lfo.connect(lg); lg.connect(pad.gain); lfo.start();
  },
  setEnabled(on) {
    this.enabled = on;
    if (this.master) { const t = this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(on ? 0.75 : 0, t, 0.06); }
  },
  ok() { return this.ctx && this.enabled && this.ctx.state === 'running'; },
  tone(f, dur = 0.3, o = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    const g = c.createGain(); const v = o.vol ?? 0.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.012)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const flt = c.createBiquadFilter(); flt.type = o.ftype || 'bandpass'; flt.Q.value = o.q || 1.5;
    flt.frequency.setValueAtTime(o.f0 || 800, t); flt.frequency.exponentialRampToValueAtTime(o.f1 || 300, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(this.master); src.start(t); src.stop(t + dur + 0.05);
  },
  bloop() { this.tone(360, 0.22, { to: 200, vol: 0.14 }); this.tone(720, 0.1, { to: 1100, vol: 0.05, delay: 0.05 }); },
  blip() { const f = 500 + Math.random() * 700; this.tone(f, 0.08, { to: f * 1.9, vol: 0.035 }); },
  reveal(base) { [0, 4, 7, 12, 16].forEach((s, i) => this.tone(base * 2 ** (s / 12), 0.4, { type: 'triangle', vol: 0.13, delay: i * 0.07 })); this.tone(base * 4, 0.7, { vol: 0.04, delay: 0.38 }); },
  chirp(f) { this.tone(f, 0.13, { to: f * 1.5, vol: 0.1, type: 'triangle' }); this.tone(f * 1.25, 0.14, { to: f * 1.9, vol: 0.09, type: 'triangle', delay: 0.15 }); },
  home(f) { [0, 7, 12].forEach((s, i) => this.tone(f * 2 ** (s / 12), 0.6, { vol: 0.12, delay: i * 0.1 })); this.tone(f * 3, 1.0, { vol: 0.04, delay: 0.3, type: 'triangle' }); },
  note(f) { this.tone(f, 1.1, { vol: 0.26, attack: 0.005 }); this.tone(f * 4.0, 0.18, { vol: 0.05, attack: 0.003 }); this.tone(f * 2.0, 0.5, { vol: 0.06, attack: 0.005 }); },
  puff() { this.tone(260, 0.45, { to: 760, vol: 0.14, type: 'triangle' }); this.noise(0.35, { f0: 400, f1: 1600, vol: 0.06 }); },
  deflate() { this.noise(0.6, { f0: 1800, f1: 300, vol: 0.06, q: 3 }); this.tone(620, 0.5, { to: 240, vol: 0.06 }); },
  giggle() { [0, 1, 2, 3].forEach((i) => this.tone(700 + i * 90, 0.09, { to: 900 + i * 90, vol: 0.08, delay: i * 0.09, type: 'triangle' })); },
  boing() { this.tone(220, 0.5, { to: 520, vol: 0.12, glide: 0.25 }); },
  welcome() { [0, 4, 7].forEach((s, i) => this.tone(392 * 2 ** (s / 12), 0.5, { vol: 0.12, delay: i * 0.12, type: 'triangle' })); },
  partyTune() {
    if (!this.ok()) return;
    const mel = [0, 4, 7, 12, 9, 7, 4, 7, 0, 4, 7, 9, 12, 9, 7, 12, 12, 14, 12, 9, 7, 9, 7, 4, 0, 4, 7, 4, 0, -5, 0, 12];
    const step = 0.19; const C = 523.25;
    mel.forEach((s, i) => { this.tone(C * 2 ** (s / 12), 0.32, { type: 'triangle', vol: 0.11, delay: i * step }); if (i % 2 === 0) this.tone(C * 2 ** (s / 12) * 2, 0.08, { vol: 0.025, delay: i * step }); });
    const bass = [-24, -27, -31, -29, -24, -27, -29, -24];
    bass.forEach((s, i) => { this.tone(C * 2 ** (s / 12), 0.7, { vol: 0.16, delay: i * step * 4 }); this.noise(0.08, { f0: 3000, f1: 1500, vol: 0.03, delay: i * step * 4 + step * 2 }); });
  },
  tick(dt) {
    if (!this.ok()) return;
    this.ambientT -= dt;
    if (this.ambientT <= 0) { this.blip(); this.ambientT = 1.5 + Math.random() * 3.5; }
  },
};

function startGame() {
  if (game.state !== 'start') return;
  Sound.init(); Sound.welcome();
  $('start').classList.add('hidden');
  game.state = 'play';
}
$('start').addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); });

function replay() {
  if (game.state !== 'party') return;
  Sound.init(); Sound.welcome();
  $('fade').classList.add('on');
  $('replayBtn').classList.remove('show');
  game.state = 'fading';
  setTimeout(() => { game.round++; resetRound(); game.state = 'play'; game.idle = 6; $('fade').classList.remove('on'); }, 480);
}
$('replayBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); replay(); });

// ---------------------------------------------------------------- input
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tapPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -SUB_Z);
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), camRight = new THREE.Vector3();

function toScreen(v, out = { x: 0, y: 0, z: 0 }) {
  tmpV.copy(v).project(camera);
  out.x = (tmpV.x * 0.5 + 0.5) * innerWidth; out.y = (-tmpV.y * 0.5 + 0.5) * innerHeight; out.z = tmpV.z;
  return out;
}
function screenRadius(v, r) {
  const a = toScreen(v, {}); camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  const b = toScreen(tmpV2.copy(v).addScaledVector(camRight, r), {});
  return Math.hypot(b.x - a.x, b.y - a.y);
}
function screenToWorld(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = new THREE.Vector3();
  return raycaster.ray.intersectPlane(tapPlane, hit) ? hit : null;
}

function interactives() {
  const list = [];
  if (game.state === 'play') {
    for (const s of spots) if (!s.revealed) list.push({ kind: 'spot', center: s.center, r: 2.0, ref: s });
    list.push({ kind: 'arch', center: tmpArch.set(ARCH.x, ARCH.y + 1.9, ARCH.z), r: 2.9 });
  }
  list.push({ kind: 'puffer', center: puffer.center, r: 1.3 * (1 + puffer.inflate * 0.6) });
  for (const ins of instruments) list.push({ kind: 'instrument', center: ins.center, r: 0.8, ref: ins });
  list.push({ kind: 'sub', center: sub.pos, r: 1.7 });
  for (const j of decorJellies) list.push({ kind: 'jelly', center: j.g.position, r: 1.3 * j.s, ref: j, soft: true });
  return list;
}
const tmpArch = new THREE.Vector3();

function handleTap(x, y) {
  if (game.state === 'start' || game.state === 'fading') return;
  Sound.init();
  game.firstTap = true; game.idle = 0;
  let best = null, bestD = 1;
  for (const it of interactives()) {
    const s = toScreen(it.center, {});
    const rpx = Math.max(screenRadius(it.center, it.r), 46);
    const d = Math.hypot(s.x - x, s.y - y) / rpx;
    if (d < bestD) { bestD = d; best = it; }
  }
  if (best) {
    if (best.kind === 'spot') return revealSpot(best.ref);
    if (best.kind === 'arch') return goTo(new THREE.Vector3(ARCH.x, ARCH.y + 1.7, SUB_Z), true);
    if (best.kind === 'puffer') return tapPuffer();
    if (best.kind === 'instrument') return playInstrument(best.ref);
    if (best.kind === 'sub') { sub.wiggle = 1; Sound.giggle(); sparkleBurst(sub.pos, 0xfff3a0, 10, 2.5); return; }
    if (best.kind === 'jelly') { best.ref.boing = 1; Sound.boing(); sparkleBurst(best.ref.g.position, 0xffd1f0, 8, 2); }
  }
  if (game.state !== 'play') { const w = screenToWorld(x, y); if (w) { bubbleBurst(w, 6); Sound.blip(); } return; }
  const w = screenToWorld(x, y);
  if (w) goTo(w);
}
function goTo(w, quiet) {
  const t = new THREE.Vector3(clamp(w.x, BOUNDS.minX, BOUNDS.maxX), 0, SUB_Z);
  t.y = clamp(w.y, subMinY(t.x), BOUNDS.maxY);
  sub.target.copy(t);
  ripple(t, 0xffffff, 1.1, 0.9, 0.8); ripple(t, 0x9ffcff, 0.7, 0.7, 0.6, 0.1);
  if (!quiet) Sound.bloop(); else Sound.blip();
}
function bubbleBurst(v, n) { for (let i = 0; i < n; i++) bubbleAt(v, { jx: 0.6, jz: 0.4, vy: 0.5 + Math.random(), vx: (Math.random() - 0.5) * 1.5, size: rr(0.12, 0.3), life: 2.5 }); }

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); handleTap(e.clientX, e.clientY); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------------------------------------------------------------- game actions
function revealSpot(s) {
  if (s.revealed) return;
  s.revealed = true; s.peek.visible = false;
  const c = s.creature;
  c.state = 'popping'; c.popT = 0; c.root.visible = true; c.scale = 0;
  c.pos.copy(s.center); c.pos.z += 0.3; c.from = c.pos.clone();
  c.popTo = new THREE.Vector3(s.center.x, s.center.y + 2.0, SUB_Z + 0.3);
  // send the sub over, hovering beside the hiding place
  const side = sub.pos.x < s.center.x ? -1 : 1;
  goTo(new THREE.Vector3(s.center.x + side * 2.4, s.center.y + 2.0, SUB_Z), true);
  sparkleBurst(tmpV.copy(s.center).setY(s.center.y + 0.6), c.def.color, 18, 3.5);
  ripple(s.center, c.def.color, 2.6, 1.2, 0.8);
  bubbleBurst(s.center, 10);
  Sound.reveal(c.def.note / 2);
  portraitEls[c.i].classList.add('found');
}
function playInstrument(ins) {
  ins.bounce = 1; Sound.note(ins.note);
  const top = tmpV.copy(ins.center).setY(ins.center.y + 0.6);
  sparkleBurst(top, ins.color, 8, 2); ripple(top, ins.color, 1.2, 0.8, 0.8);
  particles.spawn({ x: top.x, y: top.y, z: top.z, vy: 1.2, life: 2, size: 0.45, kind: 1, color: ins.color, lift: 0.2, wobble: 0.6 });
  stats.notes++;
}
function tapPuffer() {
  if (puffer.inflate < 0.3) Sound.puff();
  puffer.hold = 2.2; stats.puffs++;
  sparkleBurst(puffer.center, 0xffe08a, 8, 2.5);
}
function deliver() {
  for (const c of followers) {
    c.state = 'toHome'; Sound.home(c.def.note / 2);
    portraitEls[c.i].classList.add('home');
    sparkleBurst(party.homes[c.homeIdx], c.def.color, 12, 3);
  }
  followers = [];
}
function startParty() {
  game.state = 'party'; game.partyT = 0; game.confettiT = 0;
  portraitsEl.classList.add('party');
  sub.target.set(ARCH.x - 4.2, ARCH.y + 3.6, SUB_Z);
  for (const c of creatures) c.state = 'party';
  Sound.partyTune();
  stats.parties++;
}

// ---------------------------------------------------------------- update
const stats = { notes: 0, puffs: 0, parties: 0 };
const CONFETTI = [0xff6f91, 0xa66cff, 0x3ee6d8, 0xffd23f, 0xff9f45, 0xb8f04a, 0xffffff, 0xff9ad8];

function updateSub(dt, t) {
  const calm = settings.calm;
  const maxSpeed = calm ? 2.7 : 3.4;
  const to = tmpV.subVectors(sub.target, sub.pos); to.z = 0;
  const dist = to.length();
  const desired = dist > 0.04 ? to.multiplyScalar(Math.min(maxSpeed, dist * 1.15) / dist) : to.set(0, 0, 0);
  sub.vel.x = damp(sub.vel.x, desired.x, 2.2, dt); sub.vel.y = damp(sub.vel.y, desired.y, 2.2, dt);
  sub.pos.addScaledVector(sub.vel, dt);
  sub.pos.x = clamp(sub.pos.x, BOUNDS.minX, BOUNDS.maxX); sub.pos.y = clamp(sub.pos.y, subMinY(sub.pos.x), BOUNDS.maxY);
  if (Math.abs(sub.target.x - sub.pos.x) > 0.7) sub.facing = Math.sign(sub.target.x - sub.pos.x);
  sub.yaw = damp(sub.yaw, sub.facing > 0 ? 0 : -Math.PI, 2.6, dt);
  sub.wiggle = Math.max(0, sub.wiggle - dt * 1.2);
  const speed = sub.vel.length();
  sub.root.position.copy(sub.pos); sub.root.position.y += Math.sin(t * 1.6) * 0.1;
  sub.yawG.rotation.y = sub.yaw;
  sub.pitchG.rotation.z = clamp(sub.vel.y * 0.13, -0.35, 0.35);
  sub.pitchG.rotation.x = Math.sin(t * 1.2) * 0.04 + Math.sin(t * 20) * 0.12 * sub.wiggle;
  if (game.state === 'party') { sub.spin += dt * (calm ? 1.2 : 2.4); sub.pitchG.rotation.x += Math.sin(sub.spin) * 0.35; sub.model.position.y = Math.abs(Math.sin(sub.spin * 1.2)) * 0.35; }
  else sub.model.position.y = damp(sub.model.position.y, 0, 4, dt);
  sub.prop.rotation.x += dt * (3 + speed * 6);
  // eyes look toward travel direction / target
  for (const e of sub.eyes) { const p = e.userData.pupil; p.position.y = damp(p.position.y, clamp(sub.vel.y * 0.03, -0.06, 0.06), 5, dt); }
  // bubble trail from the propeller
  sub.bubT = (sub.bubT || 0) - dt;
  if (sub.bubT <= 0) {
    sub.prop.getWorldPosition(sub.tail);
    const moving = speed > 0.3;
    bubbleAt(sub.tail, { jx: 0.2, jz: 0.3, vy: 0.3, vx: -sub.facing * (0.6 + speed * 0.3), size: rr(0.1, moving ? 0.3 : 0.2), life: moving ? 3 : 2.2, lift: 0.7 });
    sub.bubT = moving ? (calm ? 0.13 : 0.06) : 0.5;
  }
}

function updateCreatures(dt, t) {
  const calm = settings.calm;
  // follow chain
  let leader = tmpV2.set(sub.pos.x - sub.facing * 2.4, sub.pos.y - 0.25, SUB_Z);
  const spacing = 1.75;
  followers.forEach((c, idx) => {
    const d = c.pos.distanceTo(leader);
    if (d > spacing) {
      const desired = tmpV.subVectors(c.pos, leader).normalize().multiplyScalar(spacing).add(leader);
      c.pos.x = damp(c.pos.x, desired.x, 6, dt); c.pos.y = damp(c.pos.y, desired.y, 6, dt);
    }
    c.pos.z = damp(c.pos.z, SUB_Z + (idx % 2 ? 0.55 : -0.25), 3, dt);
    leader = c.pos;
  });
  for (const c of creatures) {
    if (c.state === 'hidden') continue;
    if (c.state === 'popping') {
      c.popT += dt / 1.1; const k = Math.min(1, c.popT);
      c.pos.lerpVectors(c.from, c.popTo, easeInOut(k)); c.pos.y += Math.sin(k * Math.PI) * 0.8;
      c.scale = easeOutBack(Math.min(1, k * 1.4));
      c.spin = (1 - k) * Math.PI * 2;
      if (k >= 1) { c.state = 'following'; c.spin = 0; followers.push(c); Sound.chirp(c.def.note); }
    } else if (c.state === 'toHome') {
      const h = party.homes[c.homeIdx];
      c.pos.x = damp(c.pos.x, h.x, 2.2, dt); c.pos.y = damp(c.pos.y, h.y, 2.2, dt); c.pos.z = damp(c.pos.z, h.z, 2.2, dt);
      if (c.pos.distanceTo(h) < 0.12) c.state = 'home';
    } else if (c.state === 'home') {
      const h = party.homes[c.homeIdx];
      c.pos.set(h.x, h.y + Math.sin(t * 2 + c.i) * 0.15, h.z);
    } else if (c.state === 'party') {
      const n = c.i / 5 * Math.PI * 2; const sp = calm ? 0.45 : 0.9;
      const a = game.partyT * sp + n;
      const cx = ARCH.x - 4.2, cy = ARCH.y + 3.6;
      const tx = cx + Math.cos(a) * 3.4, ty = cy + Math.sin(a * 2) * 0.6 + Math.abs(Math.sin(game.partyT * (calm ? 2 : 4) + c.i)) * 0.7, tz = SUB_Z + Math.sin(a) * 1.6;
      const rate = game.partyT < 1.5 ? 2 : 8;
      c.pos.x = damp(c.pos.x, tx, rate, dt); c.pos.y = damp(c.pos.y, ty, rate, dt); c.pos.z = damp(c.pos.z, tz, rate, dt);
      c.spin = Math.sin(game.partyT * (calm ? 1.5 : 3) + c.i) * 0.5;
    }
    // facing & render
    const dx = c.pos.x - c.prev.x; const vx = dx / Math.max(dt, 1e-4);
    const sp = Math.min(1, Math.hypot(vx, (c.pos.y - c.prev.y) / Math.max(dt, 1e-4)) / 3);
    if (Math.abs(vx) > 0.35) c.facing = Math.sign(vx);
    if (c.state === 'home') c.facing = c.pos.x < ARCH.x ? 1 : -1;
    c.prev.copy(c.pos);
    if (!c.front) c.yaw = damp(c.yaw, c.facing > 0 ? 0 : -Math.PI, 3, dt);
    else c.yaw = damp(c.yaw, c.facing * 0.25, 3, dt);
    c.root.position.copy(c.pos); c.root.position.y += Math.sin(t * 2.4 + c.i * 1.7) * 0.08;
    c.yawG.rotation.y = c.yaw + (c.state === 'popping' || c.state === 'party' ? c.spin : 0);
    c.root.scale.setScalar(Math.max(0.001, c.scale));
    c.anim(t + c.i, sp);
  }
  // hand the friends over at the party arch
  if (game.state === 'play' && followers.length && Math.hypot(sub.pos.x - ARCH_CENTER.x, sub.pos.y - ARCH_CENTER.y) < 3.4) deliver();
  if (game.state === 'play' && game.partyPending < 0 && creatures.every((c) => c.state === 'home' || c.state === 'toHome')) game.partyPending = 1.0;
  if (game.partyPending > 0) { game.partyPending -= dt; if (game.partyPending <= 0 && game.state === 'play' && creatures.every((c) => c.state === 'home')) startParty(); else if (game.partyPending <= 0) game.partyPending = 0.2; }
}

function updateSpots(dt, t) {
  const calm = settings.calm;
  for (const s of spots) {
    s.open = damp(s.open, s.revealed ? 1 : 0, 3, dt);
    if (!s.revealed) {
      s.timer -= dt;
      if (s.timer <= 0) { ripple(tmpV.copy(s.center).setZ(s.center.z + 1.2), 0xffffff, 1.9, 1.6, 0.75, 0.5); s.timer = calm ? 3.4 : 2.0; }
      s.bubT -= dt;
      if (s.bubT <= 0) { bubbleAt(tmpV.copy(s.center).setY(s.center.y + 0.5), { jx: 0.8, jz: 0.3, size: rr(0.12, 0.26), vy: 0.6, life: 3 }); s.bubT = calm ? 1.3 : 0.65; }
      s.wigT -= dt;
      if (s.wigT <= 0) { s.wig = 1; s.wigT = 2.5 + Math.random() * 2.5; }
      // peeking eyes: rise, look at the sub, blink
      const pk = s.peek; const cyc = (t + s.peekPh) % 4.5;
      const up = cyc < 3.2 ? Math.min(1, cyc * 2.5) : Math.max(0, 1 - (cyc - 3.2) * 2.5);
      pk.position.y = s.inner.peekPos.y + (up - 0.4) * 0.28;
      const dx = clamp((sub.pos.x - s.center.x) * 0.02, -0.05, 0.05), dy = clamp((sub.pos.y - s.center.y) * 0.02, -0.04, 0.05);
      const blink = ((t + s.peekPh * 3) % 3.1) < 0.14 ? 0.12 : 1;
      for (const e of pk.userData.eyes) { e.userData.pupil.position.x = dx; e.userData.pupil.position.y = dy; e.scale.y = blink; }
      pk.position.x = s.inner.peekPos.x + Math.sin(t * 0.9 + s.peekPh) * 0.12;
    }
    s.wig = Math.max(0, s.wig - dt * 1.4);
    s.inner.setOpen(s.open, t, Math.sin(s.wig * 14) * s.wig * (calm ? 0.5 : 1));
    s.inner.group.rotation.z = Math.sin(s.wig * 16) * s.wig * (calm ? 0.025 : 0.05);
  }
}

function updateWorld(dt, t) {
  const calm = settings.calm;
  // rays
  for (const r of rays) {
    const d = r.userData;
    r.material.opacity = calm ? d.base : d.base * (0.7 + 0.3 * Math.sin(t * 0.5 + d.ph));
    r.position.x = d.x0 + (calm ? 0 : Math.sin(t * 0.12 + d.ph) * 0.8);
  }
  scene.userData.caustic.offset.set(t * 0.012, t * 0.007);
  // glows
  for (let i = 0; i < glowList.length; i++) { const g = glowList[i]; g.material.opacity = g.userData.baseOpacity * (calm ? 1 : 0.75 + 0.25 * Math.sin(t * 1.5 + i)); }
  // jellies
  for (const j of decorJellies) {
    const k = Math.sin(t * 1.1 + j.ph);
    j.g.position.set(j.base.x + Math.sin(t * 0.2 + j.ph) * 1.2, j.base.y + k * 0.5, j.base.z);
    j.boing = Math.max(0, j.boing - dt * 1.2);
    const pulse = 1 + 0.06 * Math.sin(t * 2.2 + j.ph) + Math.sin(j.boing * 18) * 0.15 * j.boing;
    j.g.userData.inner.scale.set(pulse, 2 - pulse, pulse);
  }
  // school
  for (const f of schoolFish) {
    const span = 70; const x = ((t * f.sp + f.off * 3) % span) - span / 2;
    f.m.position.set(x, f.y + Math.sin(t + f.off) * 0.4, f.z); f.m.rotation.z = Math.sin(t * 2 + f.off) * 0.05;
  }
  // instruments
  for (const ins of instruments) {
    ins.bounce = Math.max(0, ins.bounce - dt * 2.2);
    const b = Math.sin(ins.bounce * 12) * ins.bounce;
    ins.inner.scale.set(1 + b * 0.18, 1 - b * 0.22 + ins.bounce * 0.1, 1);
  }
  // pufferfish
  const pf = puffer;
  pf.hold = Math.max(0, pf.hold - dt);
  const prevInf = pf.inflate;
  pf.inflate = damp(pf.inflate, pf.hold > 0 ? 1 : 0, pf.hold > 0 ? 6 : 1.6, dt);
  if (prevInf > 0.9 && pf.hold <= 0 && !pf.deflating) { pf.deflating = true; Sound.deflate(); for (let i = 0; i < 6; i++) bubbleAt(pf.center, { jx: 0.5, size: rr(0.1, 0.22), life: 2 }); }
  if (pf.hold > 0) pf.deflating = false;
  const inf = pf.inflate;
  pf.center.set(pf.base.x + Math.sin(t * 0.25) * 2.2, pf.base.y + Math.sin(t * 0.7) * 0.35, pf.base.z);
  pf.g.position.copy(pf.center);
  const s = 1 + inf * 0.75; pf.inner.scale.setScalar(s);
  pf.inner.rotation.y = Math.cos(t * 0.25) > 0 ? damp(pf.inner.rotation.y, 0.35, 2, dt) : damp(pf.inner.rotation.y, -0.35, 2, dt);
  pf.inner.rotation.z = Math.sin(t * 1.3) * 0.08;
  for (const sp of pf.spikes.children) sp.scale.set(0.05 + inf * 0.03, 0.12 + inf * 0.28, 0.05 + inf * 0.03);
  pf.sm.visible = inf < 0.5; pf.oh.visible = inf >= 0.5;
  pf.fins.forEach((f, i) => f.rotation.y = Math.sin(t * 10 + i * 3) * 0.6);
  pf.tail.rotation.y = Math.sin(t * 6) * 0.4;

  // party arch
  const allFound = creatures.every((c) => c.state !== 'hidden' && c.state !== 'popping');
  const partying = game.state === 'party';
  const pulse = 0.5 + 0.5 * Math.sin(t * (calm ? 1.5 : 3));
  party.portalMat.opacity = (allFound ? 0.5 : 0.28) + pulse * (allFound ? 0.3 : 0.12);
  party.big.material.opacity = (allFound ? 0.5 : 0.3) + pulse * 0.15;
  party.archMat.emissive.setHex(allFound ? 0x9a2a5c : 0x6a1a3c);
  party.beacon.material.opacity = damp(party.beacon.material.opacity, allFound && game.state === 'play' ? 0.35 + pulse * 0.15 : partying ? 0.25 : 0, 2, dt);
  party.floorRing.material.opacity = 0.3 + pulse * 0.25;
  party.lights.forEach((l, i) => {
    if (partying) { l.m.material.color.setHSL(((t * (calm ? 0.1 : 0.35)) + i / 11) % 1, 0.9, 0.65); l.gl.material.color.copy(l.m.material.color); }
    else { const on = allFound ? 0.6 + 0.4 * Math.sin(t * 4 - i * 0.6) : 0.65; l.m.material.color.setRGB(1, 0.95 * on + 0.05, 0.6 * on); l.gl.material.color.setHex(0xffe08a); }
  });

  // party confetti & replay button
  if (partying) {
    game.partyT += dt;
    game.confettiT -= dt;
    while (game.confettiT <= 0 && game.partyT < (calm ? 30 : 60)) {
      const n = calm ? 1 : 4;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI;
        particles.spawn({
          x: ARCH.x + Math.cos(a) * (party.R0 + 0.4), y: ARCH.y + Math.sin(a) * (party.R0 + 0.4) + 0.2, z: ARCH.z + 0.6,
          vx: Math.cos(a) * rr(1.5, 4) - 1.5, vy: Math.sin(a) * rr(1.5, 4), vz: rr(-0.5, 1.5),
          life: rr(3, 5), size: rr(0.25, 0.5), color: pick(CONFETTI), lift: 0.35, drag: 1.1, alpha: 0.95, wobble: 0.6,
        });
      }
      if (!calm && Math.random() < 0.3) particles.spawn({ x: ARCH.x - 4.2 + rr(-5, 5), y: ARCH.y + rr(2, 7), z: SUB_Z + 1, life: 1, size: 0.5, kind: 1, color: pick(CONFETTI), lift: 0, drag: 2, wobble: 0 });
      game.confettiT += calm ? 0.12 : 0.04;
    }
    if (game.partyT > (calm ? 4 : 5) && !game.replayShown) { game.replayShown = true; $('replayBtn').classList.add('show'); }
    if (Math.floor(game.partyT / 6.2) !== Math.floor((game.partyT - dt) / 6.2) && game.partyT < 20) Sound.partyTune();
  }
}

// hint
const hintEl = $('hint');
function updateHint(dt) {
  let target = null;
  if (game.state === 'play') {
    game.idle += dt;
    const popping = creatures.some((c) => c.state === 'popping');
    const hidden = spots.filter((s) => !s.revealed);
    const threshold = hidden.length ? 9 : 4;
    if (!popping && (!game.firstTap || game.idle > threshold)) {
      if (hidden.length) { hidden.sort((a, b) => Math.abs(a.center.x - sub.pos.x) - Math.abs(b.center.x - sub.pos.x)); target = hidden[0].center; }
      else if (creatures.some((c) => c.state === 'following')) target = tmpArch.set(ARCH.x, ARCH.y + 1.9, ARCH.z);
    }
  }
  if (target) { const s = toScreen(target, {}); hintEl.style.transform = `translate(${s.x}px, ${s.y}px)`; hintEl.classList.add('show'); hintEl.dataset.target = hintTargetName(target); }
  else { hintEl.classList.remove('show'); hintEl.dataset.target = ''; }
}
function hintTargetName(t) { if (t === tmpArch) return 'arch'; const s = spots.find((sp) => sp.center === t); return s ? 'spot' + spots.indexOf(s) : ''; }

// ---------------------------------------------------------------- resize / loop
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const D = Math.max(6.4 / tanV, 15.2 / (tanV * camera.aspect));
  camera.position.set(0, 1.4 + D * (camera.aspect < 1 ? 0.03 : 0.16), D);
  camera.lookAt(0, 1.4, 0);
  camera.far = D + 120; camera.updateProjectionMatrix();
  scene.fog.near = D * 0.85; scene.fog.far = D + 42;
  particles.mat.uniforms.uScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * tanV);
}
addEventListener('resize', resize);
resize();
resetRound();
document.addEventListener('visibilitychange', () => { if (!Sound.ctx) return; if (document.hidden) Sound.ctx.suspend(); else if (game.state !== 'start') Sound.ctx.resume(); });

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05) * game.timeScale; last = now;
  T += dt; U.time.value = T;
  updateSub(dt, T);
  updateCreatures(dt, T);
  updateSpots(dt, T);
  updateWorld(dt, T);
  updateRipples(dt);
  particles.update(dt, T);
  Sound.tick(dt);
  updateHint(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- test / debug hook (used by the automated check)
window.__bubbleSub = {
  get state() { return game.state; },
  get round() { return game.round; },
  get layout() { return layoutSig; },
  set timeScale(v) { game.timeScale = v; },
  get stats() { return { ...stats, particles: particles.count }; },
  settings,
  sub: () => ({ x: sub.pos.x, y: sub.pos.y, tx: sub.target.x, ty: sub.target.y, speed: sub.vel.length() }),
  creatures: () => creatures.map((c) => ({ id: c.def.id, state: c.state, x: c.pos.x, y: c.pos.y })),
  spots: () => spots.map((s) => ({ type: s.type, slot: s.slot, creature: s.creature.def.id, revealed: s.revealed, screen: toScreen(s.center, {}) })),
  screenOf: (x, y, z = SUB_Z) => toScreen(new THREE.Vector3(x, y, z), {}),
  archScreen: () => toScreen(new THREE.Vector3(ARCH.x, ARCH.y + 1.9, ARCH.z), {}),
  pufferScreen: () => toScreen(puffer.center, {}),
  puffer: () => ({ inflate: puffer.inflate }),
  instrumentScreens: () => instruments.map((i) => toScreen(i.center, {})),
  hint: () => hintEl.dataset.target || '',
};
</script>
